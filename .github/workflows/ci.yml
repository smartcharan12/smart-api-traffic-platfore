# Push / PR -> build -> static checks -> tests -> Docker build -> full-stack smoke test.
# No deployment: this project is run locally or with docker compose.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Gateway (build, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # javac runs with -Xlint:all -Werror (static check). Integration tests use Testcontainers
      # (postgres:17-alpine, redis:7-alpine) on the runner's Docker.
      - name: Build, lint and test
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  demo-service:
    name: Demo service (build, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, lint and test
        working-directory: services/demo-service
        run: ./mvnw -B verify

  frontend:
    name: Dashboard (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  scripts:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh tests/load/*.sh

  docker:
    name: Docker images + full-stack smoke test
    needs: [backend, demo-service, frontend, scripts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throwaway secrets
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke test
        run: scripts/ci-smoke-test.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
