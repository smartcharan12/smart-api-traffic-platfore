# Serves the dashboard and forwards API calls to the gateway, so the browser talks to ONE origin
# (no CORS needed inside Docker Compose).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Request bodies are limited by the gateway too (413); this stops huge uploads earlier.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /gateway/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: unknown paths (/health, /logs, ...) are client-side routes -> index.html.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer;
    }

    # Built assets have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
