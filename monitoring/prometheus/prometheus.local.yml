# Prometheus scrape configuration (local run: gateway on localhost:8080).
global:
  scrape_interval: 5s        # short, so demos show changes quickly; 15-30s is typical in production
  evaluation_interval: 5s

scrape_configs:
  - job_name: smart-api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["localhost:8080"]
