# Prometheus scrape configuration (Docker Compose network: the gateway is reachable as "gateway").
global:
  scrape_interval: 5s        # short, so demos show changes quickly; 15-30s is typical in production
  evaluation_interval: 5s

scrape_configs:
  - job_name: smart-api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
