# Values of the form ${ENV_VAR:default} read an environment variable, falling back to the default.
# DB_PASSWORD deliberately has no default: secrets never live in the repository (see .env.example).
spring:
  application:
    name: smart-api-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_api}
    username: ${DB_USERNAME:smart_api}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast when the database is unreachable instead of blocking a request thread for the
      # default 30 seconds. Keeps /api/health responsive during a database outage.
      connection-timeout: 3000
  jpa:
    # Keeping the Hibernate session open during view rendering hides lazy-loading bugs and holds a
    # DB connection for the whole request. Disabled: all data is loaded inside @Transactional services.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only verifies that entities match it and refuses to start if not.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # request_logs are written in batches (RequestLogWriter); works because their ids come
          # from a pooled sequence, not IDENTITY (see V1 migration)
          batch_size: 100
        order_inserts: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      # Short timeouts: Redis is an optimisation. A slow Redis must not make every request slow;
      # RedisGuard falls back after a few failures.
      timeout: 250ms
      connect-timeout: 500ms
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

# Every log line carries the request id (set by RequestIdFilter), e.g.  INFO [7c3e...] gateway.access : ...
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

# Phase 2: the gateway. Bound to GatewayProperties (validated at startup).
gateway:
  proxy:
    connect-timeout: 1s        # opening a TCP connection to an instance
    response-timeout: 5s       # waiting for the instance to answer -> 504 when exceeded
  circuit-breaker:             # per backend address; see resilience/CircuitBreaker
    enabled: true
    sliding-window-size: 10    # decide on the last 10 calls
    minimum-calls: 5
    failure-rate-threshold: 50 # percent -> OPEN
    open-duration: 10s         # reject calls, then allow trial calls (HALF_OPEN)
    half-open-permitted-calls: 2
    failure-statuses: 500,502,503,504
  retry:                       # see resilience/RetryDecider for what is retried
    max-attempts: 3            # 1 try + up to 2 retries (1 disables retries)
    initial-backoff: 100ms     # 100 ms, 200 ms, 400 ms ... each +/- jitter
    multiplier: 2.0
    max-backoff: 1s
    jitter: 0.2
    budget-ratio: 0.2          # retries capped at ~20% of requests (retry-storm protection)
    budget-max-tokens: 20
  discovery:
    cache-ttl: 5s              # reuse route lookups; registry changes via this gateway apply immediately
  health-check:                # active probes of GET <service health path> on every instance
    enabled: true
    interval: 5s
    initial-delay: 2s
    timeout: 2s
    degraded-latency: 500ms    # slower successful probe -> DEGRADED
    unhealthy-threshold: 3     # consecutive failures -> DOWN
    healthy-threshold: 2       # consecutive successes before DOWN -> HEALTHY
    threads: 8
  request-log:                 # persisted request_logs rows (async, batched, bounded queue)
    enabled: true
    queue-capacity: 10000      # full queue -> rows dropped and counted, requests never wait
    batch-size: 500
    retention: 7d
  cache:                       # shared Redis response cache; only what the backend marks cacheable
    enabled: true
    max-ttl: 5m
    max-body-bytes: 262144
  rate-limit:
    enabled: true
    algorithm: TOKEN_BUCKET    # FIXED_WINDOW | SLIDING_WINDOW | TOKEN_BUCKET
    limit: 100                 # requests per window (token bucket: capacity 100, refill 100/60s)
    window: 1m
    key-by: IP                 # any of IP, USER, ENDPOINT, e.g. "USER,ENDPOINT"
    trust-forwarded-for: false # only true behind a proxy you control (see ClientIpResolver)
    store: ${RATE_LIMIT_STORE:REDIS}  # REDIS = shared by all gateways (local fallback while Redis is down); LOCAL

management:
  health:
    redis:
      enabled: false   # Redis is optional (see RedisGuard); /api/health reports it without failing liveness
  endpoints:
    web:
      exposure:
        include: health,info
