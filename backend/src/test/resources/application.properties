# Test-only values. These are NOT secrets: they exist only in the test classpath and are never used
# by a running deployment (which must supply JWT_SECRET / ADMIN_* through the environment).
security.jwt.secret=test-only-jwt-secret-with-at-least-32-characters
security.bootstrap-admin.username=admin
security.bootstrap-admin.password=admin-test-password
security.trust-user-id-header=true
